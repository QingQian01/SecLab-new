upstream seclab_user_service {
    server 127.0.0.1:8083;
}

upstream seclab_experiment_service {
    server 127.0.0.1:8084;
}

upstream seclab_ai_agent_service {
    server 127.0.0.1:8010;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 8088;
    server_name _;

    root /opt/seclab/SecLab/SecLab-FrontEnd-2/dist;
    index index.html;

    client_max_body_size 50m;

    # Font Awesome 等字体文件需要正确的 MIME 类型，否则 Edge/Chrome 不加载图标。
    # nginx 默认 mime.types 缺少 woff2 和 ttf，用 location 块仅对字体文件补充类型，
    # 避免在 server 块用 types{} 覆盖全局 MIME 映射。
    location ~* \.(woff2|woff|ttf|eot|otf)$ {
        types {
            font/woff2                         woff2;
            font/woff                          woff;
            font/ttf                           ttf;
            application/vnd.ms-fontobject      eot;
            font/otf                           otf;
        }
    }

    location /targets/sqli/ {
        proxy_pass http://127.0.0.1:8091/;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;
    }

    location /targets/xss/ {
        proxy_pass http://127.0.0.1:8092/;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;
    }

    location /targets/csrf/ {
        proxy_pass http://127.0.0.1:8093/;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;
    }

    location /targets/cmd/ {
        proxy_pass http://127.0.0.1:8090/;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;
    }

    location /targets/upload/ {
        proxy_pass http://127.0.0.1:8094/;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;
    }

    location /targets/dir/ {
        proxy_pass http://127.0.0.1:8095/;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;
    }

    # 栈溢出实验（stack-overflow-lab 8096）
    location /targets/stack/ {
        proxy_pass http://127.0.0.1:8096/;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;
    }

    # 协议分析实验（protocol-analysis-lab 8896）
    location /targets/protocol/ {
        proxy_pass http://127.0.0.1:8896/;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;
    }

    # 图片服务 image-service（恢复部署，服务课程封面与头像）
    location /api/images/ {
        proxy_pass http://127.0.0.1:8086/api/images/;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;
        client_max_body_size 10m;
    }

    location /api/docker/vnc/ {
        proxy_pass http://seclab_ai_agent_service;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    location /api/docker/ {
        proxy_pass http://seclab_ai_agent_service;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;
    }

    location /api/external/ {
        proxy_pass http://seclab_ai_agent_service;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;
    }

    location /api/lab-sessions/ {
        proxy_pass http://seclab_ai_agent_service;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;
    }

    location /api/flags/ {
        proxy_pass http://seclab_ai_agent_service;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;
    }

    location /api/questions/ {
        proxy_pass http://seclab_ai_agent_service;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;
    }

    location /api/profile/ {
        proxy_pass http://seclab_ai_agent_service;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;
    }

    location /api/training/ {
        proxy_pass http://seclab_ai_agent_service;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;
    }

    location /api/class-profile/ {
        proxy_pass http://seclab_ai_agent_service;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;
    }

    location /api/scoreboard {
        proxy_pass http://seclab_ai_agent_service;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;
    }

    location /api/teacher/ {
        proxy_pass http://seclab_ai_agent_service;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;
    }

    location /api/lab/events {
        proxy_pass http://seclab_ai_agent_service;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;
    }

    location = /api/chat {
        proxy_pass http://seclab_ai_agent_service;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location /api/agent/ {
        rewrite ^/api/agent/?(.*)$ /$1 break;
        proxy_pass http://seclab_ai_agent_service;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_buffering off;
    }

    # 学生能力成长、教师布置等 API（ai-agent-service）
    location /api/students/ {
        proxy_pass http://seclab_ai_agent_service;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;
    }

    # AI 交互事件上报（ai-agent-service）
    location /api/events/ {
        proxy_pass http://seclab_ai_agent_service;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;
    }

    # AI 分析健康检查（ai-agent-service）
    location /health/ {
        proxy_pass http://seclab_ai_agent_service;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;
    }

    location /course/ {
        proxy_pass http://seclab_experiment_service;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;
    }

    location /stu/module/ {
        proxy_pass http://seclab_experiment_service;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;
    }

    location /stu/ {
        proxy_pass http://seclab_user_service;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;
    }

    location /admin/ {
        proxy_pass http://seclab_user_service;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
