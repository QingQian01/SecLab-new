spring.application.name=image-service
server.port=8086

# ✅ 使用 MySQL 驱动和 URL（统一使用 seclab_app 用户，与其他服务保持一致）
spring.datasource.url=jdbc:mysql://${IMAGE_SERVICE_DB_HOST:${MYSQL_HOST:localhost}}:${IMAGE_SERVICE_DB_PORT:${MYSQL_PORT:3306}}/imagedb?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
spring.datasource.username=${IMAGE_SERVICE_DB_USERNAME:${MYSQL_USER:seclab_app}}
spring.datasource.password=${IMAGE_SERVICE_DB_PASSWORD:${MYSQL_PASSWORD:Seclab@123}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ✅ 使用 MySQL 的 Hibernate 方言
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect

# 文件上传配置
spring.servlet.multipart.max-file-size=6MB
spring.servlet.multipart.max-request-size=6MB

# 图片存储配置
image.upload-dir=uploads/images
image.max-file-size-bytes=5242880

# Eureka 配置
eureka.client.service-url.defaultZone=http://localhost:8080/eureka/
eureka.client.enabled=${EUREKA_CLIENT_ENABLED:false}
eureka.client.register-with-eureka=${EUREKA_REGISTER_WITH_EUREKA:false}
eureka.client.fetch-registry=${EUREKA_FETCH_REGISTRY:false}
eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=${spring.cloud.client.ip-address}:${server.port}
