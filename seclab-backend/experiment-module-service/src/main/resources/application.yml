spring:
  application:
    name: experiment-module-service
  cloud:
    discovery:
      enabled: ${EXPERIMENT_MODULE_DISCOVERY_ENABLED:false}
    inetutils:
      preferred-networks: 127.0.0.1

  datasource:
    url: jdbc:mysql://${EXPERIMENT_MODULE_DB_HOST:${MYSQL_HOST:localhost}}:${EXPERIMENT_MODULE_DB_PORT:${MYSQL_PORT:3306}}/userservice?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&characterEncoding=UTF-8
    username: ${EXPERIMENT_MODULE_DB_USERNAME:${MYSQL_USER:seclab_app}}
    password: ${EXPERIMENT_MODULE_DB_PASSWORD:${MYSQL_PASSWORD:Seclab@123}}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    database-platform: org.hibernate.dialect.MySQL8Dialect

  jackson:
    default-property-inclusion: non_null

  servlet:
    multipart:
      enabled: true
      max-file-size: 256MB
      max-request-size: 260MB
      file-size-threshold: 1MB

server:
  port: 8084
  address: 0.0.0.0

seclab:
  jwt:
    secret: ${USER_SERVICE_JWT_SECRET:SecLabUserServiceJwtSecretChangeMeAtLeast32Chars}
  lab-package:
    # 实验包 zip 落盘根目录（相对路径以服务工作目录为基准）
    storage-dir: ${LAB_PACKAGE_STORAGE_DIR:./lab-packages}
    # 单个 zip 大小上限（字节），默认 256MB
    max-size-bytes: ${LAB_PACKAGE_MAX_SIZE_BYTES:268435456}

eureka:
  client:
    enabled: ${EXPERIMENT_MODULE_EUREKA_ENABLED:false}
    service-url:
      defaultZone: ${EXPERIMENT_MODULE_EUREKA_DEFAULT_ZONE:http://localhost:8080/eureka/}
    register-with-eureka: ${EXPERIMENT_MODULE_EUREKA_REGISTER:false}
    fetch-registry: ${EXPERIMENT_MODULE_EUREKA_FETCH:false}
  instance:
    prefer-ip-address: true
    hostname: localhost
